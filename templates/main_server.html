<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 화면</title>
    <style>
        /* 배경 이미지 설정 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width:100vw;
            height: 100vh;
            background: url('../images/social_share.jpg') repeat;
            /*
            https://stackoverflow.com/questions/43744887/fullscreen-infinite-scrolling-background
            specify the scroll x (or y) with the width (or height) of the images
            In this case, the image dimension is :
            width: 1920px;
            height: 808px;
            이미지 파일 속성에서 픽셀 확인 가능
            잘못된 예시: background-size: auto 100%;
            */
            background-size: 500px x 400px;
            animation: scrollBackground 5s linear infinite; /* 무한 파노라마 애니메이션 */
            color: #fff;
        }

        /* 파노라마 애니메이션 */
        @keyframes scrollBackground {
            from {
                background-position: 0 0;
            }
            to {
                background-position: -500px 0; /* Match to the exact width or height of the image */
            }
        }

        .container {
            text-align: center;
        }
        button {
            margin: 15px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #007BFF, #00d4ff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transform: scale(1); /* 기본 크기 */
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* 크기 및 그림자 애니메이션 */
        }
        button:hover {
            background: linear-gradient(45deg, #0056b3, #0096c7);
            transform: scale(1.1); /* 크기 10% 증가 */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        /* 모바일 친화적 디자인 */
        @media (max-width: 768px) {
            button {
                margin: 10px;
                padding: 12px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- JavaScript 파일 추가 -->
    <script src="{{ url_for('static', filename='js/audio.js') }}"></script>
    <div class="container">
        <div id="audio-permission" style="position: absolute; top: 10px; right: 10px;">
            <button id="audio-toggle-button" style="padding: 10px 20px; font-size: 16px;">
                🔊 소리 허용
            </button>
        </div>
        <h1>Main Server</h1>
        <button id="function-button-1" onclick="location.href='/nav/'">네비게이션</button>
        <button id="function-button-2" onclick="location.href='/tracking'">트랙킹</button>
        <button id="function-button-3" onclick="location.href='/guideline'">가이드라인</button>
        <button id="function-button-4" onclick="location.href='/remap'">재매핑</button>
    </div>
</body>
</html>
