<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guideline OCR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
            background-color: #f8f9fa;
        }
        #container1 {
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
        }
        select, input[type="number"] {
            margin-top: 10px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #container2 {
            position: relative;
            display: inline-block;
            margin: 0 auto;
        }
        #uploadedImage {
            max-width: 100%;
            height: auto;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }
        .result {
            margin-top: 20px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="container1" class="container">
        <h1>도면 업로드 및 거리 측정</h1>
        
        <form action="/guideline" method="post" enctype="multipart/form-data">
            <label for="file">도면 이미지 파일:</label>
            <input type="file" name="file" id="file" required>
            <button type="submit">업로드</button>
        </form>

        {% if uploaded_image_url %}
            <h2>업로드된 이미지:</h2>
            <div id="container2" class="container">
                <img id="uploadedImage" src="{{ uploaded_image_url }}" alt="Uploaded Image" style="max-width: 100%; height: auto;">
                <canvas id="canvas"></canvas>
            </div>
            <div class="result">
                <p>두 점 간의 픽셀 거리: <span id="distance">0</span> 픽셀</p>
                <button id="resetPoints">점 초기화</button>
            </div>
        {% endif %}

        {% if extracted_numbers %}
            <h2>숫자 선택:</h2>
            <select id="numberDropdown">
                {% for number in extracted_numbers %}
                    <option value="{{ number }}">{{ number }}</option>
                {% endfor %}
                <option value="manual">직접 입력</option>
            </select>
            <input type="number" id="manualInput" placeholder="숫자 입력" class="hidden">
        {% endif %}

        <h2>거리 단위 선택:</h2>
        <select id="unitDropdown">
            <option value="km">킬로미터(km)</option>
            <option value="m">미터(m)</option>
            <option value="cm">센티미터(cm)</option>
            <option value="mm">밀리미터(mm)</option>
        </select>
    </div>

    <script>
        const numberDropdown = document.getElementById("numberDropdown");
        const manualInput = document.getElementById("manualInput");

        if(numberDropdown) {
            console.log("도면에서 숫자 추출 완료. 숫자를 선택하세요.");
            numberDropdown.addEventListener("change", () => {
                if (numberDropdown.value === "manual") {
                    manualInput.classList.remove("hidden");
                } else {
                    manualInput.classList.add("hidden");
                }
            });
        }
        else {
            console.log("도면을 업로드하세요.");
        }

        let points = [];
        const uploadedImage = document.getElementById('uploadedImage');
        
        if (uploadedImage) {
            // 캔버스 초기화
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const distanceElement = document.getElementById('distance');
            const resetButton = document.getElementById('resetPoints');

            // 이미지가 로드되면 캔버스 크기 설정
            uploadedImage.onload = function() {
            // 캔버스 크기를 이미지와 정확히 일치시킴
            canvas.width = uploadedImage.naturalWidth;
            canvas.height = uploadedImage.naturalHeight;
            
            // 캔버스 스타일 크기를 이미지의 표시 크기와 일치시킴
            canvas.style.width = uploadedImage.clientWidth + 'px';
            canvas.style.height = uploadedImage.clientHeight + 'px';
            
            console.log('이미지 로드됨. 캔버스 크기 설정 완료.');
            };
            
            // 윈도우 크기가 변경되면 캔버스 크기 조정
            window.addEventListener('resize', function() {
                if (uploadedImage.complete) {
                    canvas.style.width = uploadedImage.clientWidth + 'px';
                    canvas.style.height = uploadedImage.clientHeight + 'px';

                    console.log('윈도우 크기 변경됨. 캔버스 크기 조정 완료.');
                }
            });
            
            // 캔버스 클릭 이벤트
            canvas.addEventListener('click', function(event) {
                if (points.length >= 2) {
                    // 점이 두 개 이상이면 경고 메시지 표시
                    alert('점은 최대 두 개까지만 찍을 수 있습니다.');
                    return;
                }

                // 캔버스 내 클릭 좌표 계산 (비율 고려)
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                const x = (event.clientX - rect.left) * scaleX;
                const y = (event.clientY - rect.top) * scaleY;
                
                // 점 추가
                points.push({x, y});
                
                // 캔버스 다시 그리기
                drawOnCanvas();
            });
            
            // 캔버스에 그리기 함수
            function drawOnCanvas() {
                // 캔버스 지우기
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 점 그리기
                points.forEach(point => {
                    ctx.fillStyle = 'red';
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // 두 점이 있으면 선 그리고 거리 계산
                if (points.length === 2) {
                    // 선 그리기
                    ctx.strokeStyle = 'blue';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    ctx.lineTo(points[1].x, points[1].y);
                    ctx.stroke();
                    
                    // 거리 계산
                    const dx = points[1].x - points[0].x;
                    const dy = points[1].y - points[0].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // 거리 표시
                    distanceElement.textContent = distance.toFixed(2);
                }
            }

            // 점 초기화 버튼
            if (resetButton) {
                resetButton.addEventListener('click', function() {
                    points = [];
                    distanceElement.textContent = '0';
                    console.log('점 초기화됨.');
                    drawOnCanvas();
                });
            }
        }
    </script>
</body>
</html>
